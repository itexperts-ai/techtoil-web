# Techtoil — static SPA (Vite dist) behind nginx + HTTPS
# Domain: techtoil.itexperts.org.in → this VPS
# Note: deploy.sh preserves /etc/ssl/techtoil certs when present.

server {
    listen 80;
    listen [::]:80;
    server_name techtoil.itexperts.org.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name techtoil.itexperts.org.in;

    ssl_certificate     /etc/ssl/techtoil/fullchain.pem;
    ssl_certificate_key /etc/ssl/techtoil/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/techtoil-web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|webp|json)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
